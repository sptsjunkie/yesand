  <title>Improv Prompter</title>

    body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px;flex-shrink:0}
    .logo{font-family:'DM Serif Display',Georgia,serif;font-size:22px;letter-spacing:-.3px;color:var(--text)}
    .logo span{color:var(--accent);font-style:italic}
    .theme-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;box-shadow:0 1px 3px var(--shadow)}
    .theme-btn:active{transform:scale(.92)}
    .categories-wrap{padding:0 16px 12px;flex-shrink:0}
    .categories{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;-ms-overflow-style:none}
    .categories::-webkit-scrollbar{display:none}
    .cat-btn{flex-shrink:0;padding:8px 16px;border-radius:100px;border:1px solid var(--border);background:var(--cat-bg);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap}
    .cat-btn:active{transform:scale(.94)}
    .cat-btn.active{background:var(--cat-active);color:var(--cat-active-text);border-color:var(--cat-active)}
    .main{flex:1;display:flex;flex-direction:column;padding:0 24px;gap:16px;min-height:0}
    .suggestion-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 8px var(--shadow)}
    .suggestion-category-label{font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);margin-bottom:4px}
    .suggestion-text{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(28px,8vw,42px);line-height:1.15;color:var(--text)}
    .suggestion-text.dialogue{font-size:clamp(20px,5.5vw,28px);font-style:italic}
    .suggestion-text.empty{font-size:18px;font-family:'DM Sans',sans-serif;font-weight:300;color:var(--text2);font-style:italic}
    .suggestion-text.animate{animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
    @keyframes pop{0%{transform:scale(.88);opacity:.4}100%{transform:scale(1);opacity:1}}
    .actions{display:flex;gap:10px;flex-shrink:0}
    .generate-btn{flex:1;padding:18px;border-radius:14px;background:var(--accent);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;cursor:pointer;transition:all .18s;letter-spacing:-.2px}
    .generate-btn:active{transform:scale(.96);filter:brightness(.9)}
    .examples-btn{padding:18px 20px;border-radius:14px;background:var(--surface);color:var(--text);border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px;white-space:nowrap}
    .examples-btn:active{transform:scale(.96)}
    .examples-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .examples-panel{background:var(--hint-bg);border:1px solid var(--border);border-radius:20px;overflow:hidden;flex-shrink:0;display:none}
    .examples-panel.visible{display:block}
    .examples-header{padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
    .examples-title{font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2)}
    .examples-close{width:28px;height:28px;border-radius:50%;background:var(--border);border:none;cursor:pointer;font-size:14px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .15s}
    .examples-close:active{transform:scale(.9)}
    .examples-scroll{max-height:55vh;overflow-y:auto;padding:0;-webkit-overflow-scrolling:touch}
    .def-block{padding:14px 20px;border-bottom:1px solid var(--border);animation:slideIn .2s ease forwards}
    .def-label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
    .def-pos{font-size:11px;font-style:italic;color:var(--text2);margin-bottom:3px}
    .def-text{font-size:13.5px;line-height:1.5;color:var(--text)}
    .wiki-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--blue);text-decoration:none;font-weight:500}
    .wiki-link:hover{text-decoration:underline}
    .objects-block{padding:14px 20px;border-bottom:1px solid var(--border);opacity:0;animation:slideIn .2s ease .05s forwards}
    .objects-label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:8px}
    .objects-chips{display:flex;flex-wrap:wrap;gap:6px}
    .obj-chip{padding:4px 10px;border-radius:100px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text2)}
    .hint-item{padding:14px 20px;border-bottom:1px solid var(--border);opacity:0;animation:slideIn .2s ease forwards}
    .hint-item:last-child{border-bottom:none}
    @keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .hint-num{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
    .hint-scene{font-size:14px;line-height:1.5;color:var(--text);margin-bottom:6px}
    .hint-line{font-size:13px;font-style:italic;color:var(--text2);line-height:1.4}
    .hint-line::before{content:'"'}
    .hint-line::after{content:'"'}
    footer{padding:12px 24px 20px;text-align:center;flex-shrink:0}
    .footer-text{font-size:11px;color:var(--text2);letter-spacing:.3px}
  </style>

function getObjects(suggestion, cat) {
  if (objMap[suggestion]) return objMap[suggestion];
  for (const k of Object.keys(objMap)) {
    if (suggestion.toLowerCase().includes(k.toLowerCase()) || k.toLowerCase().includes(suggestion.toLowerCase())) {
      if (objMap[k]) return objMap[k];
    }
  }
  return fallbackObjs[cat] || fallbackObjs["🌀 Scenarios"];
}

// ── DEFINITION / WIKI ────────────────────────────────────────────────────────
function getRefType(suggestion, cat) {
  const isSingle = !suggestion.includes(' ') && !suggestion.includes('&');
  if (cat === "💬 Words" && isSingle) return "dictionary";
  if (["📍 Places","⏳ Time Periods","🎬 Film Genres","💼 Occupations","😤 Emotions"].includes(cat)) return "wikipedia";
  if (isSingle && cat !== "💬 Dialogue") return "wikipedia";
  return "none";
}

async function fetchDef(word) {
  try {
    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`);
    if (!r.ok) return null;
    const d = await r.json();
    const m = d[0]?.meanings?.[0];
    if (!m) return null;
    return { pos: m.partOfSpeech, def: m.definitions?.[0]?.definition, phonetic: d[0]?.phonetic || d[0]?.phonetics?.[0]?.text };
  } catch { return null; }
}

    {scene:"The laundromat is the site of a weekly, unofficial therapy session between regulars who pretend it isn't.",line:"Same machine every Tuesday. I'll listen if you fold."}

  "a bowling alley":[

  ],
  "a cruise ship":[

  ],
  "a parking garage":[
    {scene:"Two people can't find their cars and begin to suspect something larger is happening.",line:"Level 3, Section B. I'm sure of it. — That's where MY car was."},

  ],
  "a farmer's market":[
    {scene:"A vendor selling terrible produce has a gift for conversation. People keep coming back.",line:"The tomatoes are awful. But I missed you last week."},

  ],
  "a carnival":[
    {scene:"A carnival game operator watches someone spend $200 trying to win a $3 bear. Something deeper is happening.",line:"It's not about the bear, is it."},
    {scene:"Two people get stuck at the top of a Ferris wheel. One has been wanting to say something all night.",line:"I think they stopped it on purpose. The universe does that sometimes."},

  ],
  "a university library":[

    {scene:"A librarian discovers two students having a whispered argument that's clearly about more than the group project.",line:"This is a library. And that is clearly not about the bibliography."}
  ],
  "a storage unit":[
    {scene:"Someone opens a storage unit they've been paying for but haven't visited in ten years.",line:"I don't remember putting half of this in here. Who was I?"},
    {scene:"Two people discover their storage units share a thin wall and they've been hearing each other for months.",line:"You're the one who cries on Thursdays. I'm the one who plays guitar badly."},
    {scene:"Someone is living in their storage unit and the manager has just found out.",line:"This is not zoned for residential. — I know. But I made curtains."}
  ],
  "a drive-through":[
    {scene:"A drive-through worker recognizes a customer who comes every night at 2 AM. Tonight they ask why.",line:"You've ordered the same thing every night for a month. Are you okay?"},
    {scene:"Two cars in the drive-through line have a conversation through their windows.",line:"Nice car. — Thanks. Nice order. I heard the whole thing."},

  ],
  "an escape room":[
    {scene:"Two strangers paired together discover they solve problems in incompatible ways.",line:"You're reading the clue wrong. — There IS no wrong way to read a clue."},

  ],
  "a jazz club":[
    {scene:"A musician plays a song meant for someone in the audience who doesn't know it's for them.",line:"That wasn't in the set list. Who was that for?"},

  ],
  "a retirement home":[
    {scene:"Two residents plan an elaborate escape to go see the ocean one more time.",line:"I've been studying the night nurse's schedule. We have a window."},
    {scene:"A new resident refuses to unpack because they believe they're going home next week.",line:"Don't put that in the dresser. I won't be here long enough."},
    {scene:"A grandchild visits for the first time in years and doesn't know what to say.",line:"You got tall. I got… this."}
  ],
  "a comic book store":[
    {scene:"Two people reach for the same rare issue. Neither is willing to let go.",line:"I've been looking for this for eleven years. — So have I. Eleven years and three months."},
    {scene:"A parent brings their kid to the comic store and realizes they're more excited than the child.",line:"You can pick one. I'll pick… several."},
    {scene:"The store owner is closing the shop forever. The regulars are processing it like a death.",line:"This isn't just a store. You know that, right?"}
  ],
  "a dentist's office":[
    {scene:"A patient tries to have a serious conversation but the dentist keeps putting instruments in their mouth.",line:"I need to tell you somet— (drill) — mmph."},
    {scene:"The dentist recognizes the patient as someone who stood them up on a date years ago.",line:"Open wide. This might sting a little. — Why do I feel like this is personal?"},
    {scene:"Two patients in the waiting room bond over shared dental anxiety.",line:"How long have you been avoiding this? — Eleven years. You? — I'm on year eight."}
  ],
  "Times Square":[
    {scene:"Two people stand still in the chaos to have the most important conversation of their lives.",line:"I picked the loudest place I could think of. So nobody else would hear this."},
    {scene:"A street performer and a tourist have a genuine human moment amid the spectacle.",line:"Everyone walks by. You're the first person who actually stopped."},
    {scene:"Someone is trying to propose but Times Square keeps providing obstacles.",line:"I had a whole speech. Then Elmo photobombed us."}
  ],
  "a construction site":[
    {scene:"A construction worker finds something buried that stops the whole project.",line:"Shut it down. Shut everything down. Look at this."},
    {scene:"Two workers on a lunch break have a conversation that reveals everything about both of them.",line:"What did you want to be when you grew up? — Not this."},

  ],
  "a ghost town":[
    {scene:"Two urban explorers discover evidence someone still lives here.",line:"Those footprints are fresh. We're not alone."},
    {scene:"A person returns to the town they grew up in before it was abandoned.",line:"My bedroom was up there. That window was mine."},
    {scene:"A realtor is trying to sell property here to someone oddly interested.",line:"I know it's abandoned. That's the appeal."}
  ],
  "a vineyard":[
    {scene:"Two people on a wine tour realize they used to be married. To each other.",line:"I thought you moved to Portland. — I thought you moved to Portland."},

  ],
  "a space station":[

    {scene:"A crew member has been secretly growing unauthorized plants.",line:"It's not in the manual. But after 200 days, I needed to see something green."}
  ],
  "a swamp":[
    {scene:"Two people are lost in a swamp and disagree about which direction is out.",line:"I'm telling you, moss grows on the north side. — We're in a swamp. Everything is moss."},

  ],
  "a food truck":[

    {scene:"Two rival food trucks park next to each other. The owners were once partners.",line:"This block isn't big enough for both of us. You know that."},
    {scene:"A customer has a breakdown while ordering. The owner handles it with grace.",line:"I don't know what I want. I don't know what I want for anything."}
  ],
  "a radio station":[
    {scene:"A late-night DJ gets a call that changes the broadcast entirely.",line:"We're live. So whatever you're about to say, say it knowing everyone is listening."},
    {scene:"Two radio hosts who hate each other must stay cheerful on air.",line:"And we're back! With my WONDERFUL co-host. Who I LOVE working with."},

  ],

    {scene:"A juror realizes mid-trial that they know the defendant.",line:"I need to speak to the judge. I need to speak to the judge now."},
    {scene:"A lawyer's closing argument becomes unexpectedly personal.",line:"This case isn't about the facts anymore. It's about who we decide to believe."}
  ],

  ],

    {scene:"Two employees in costume have a real argument that guests think is part of the show.",line:"I'm serious. Take the head off. We need to talk."},

  ],

    {scene:"A penthouse owner invites an old friend over. The wealth gap has become uncomfortable.",line:"I didn't invite you here to make you feel bad. — Too late."}
  ],
  "a thrift store":[
    {scene:"Two people reach for the same item and both claim it has personal significance.",line:"That jacket belonged to my grandfather. — No. It belonged to mine."},
    {scene:"Someone finds their own donated belongings and wants them back.",line:"That's my lamp. I know it's my lamp because of the chip on the base."},
    {scene:"A worker discovers something valuable hidden inside a donated item.",line:"There's something sewn into the lining. I don't think this was supposed to be donated."}
  ],
  "a fire station":[
    {scene:"A firefighter's child visits and asks questions that cut too deep.",line:"Does it ever scare you? — Every time."},
    {scene:"A civilian comes to thank a firefighter from ten years ago.",line:"You probably don't remember. You saved my dog. And then you saved me."},
    {scene:"The newest recruit and the most seasoned veteran are alone on a quiet night.",line:"The quiet nights are the hardest. You'll learn that."}
  ],

    {scene:"Someone confesses something enormous in the middle of the ocean because there's no escape.",line:"I waited until we were too far from shore for you to leave."},
    {scene:"A sailing instructor realizes their student is processing a major life event, not learning to sail.",line:"You're not listening to a word I'm saying about the jib, are you."}
  ],

    {scene:"Someone reaches the top only to discover the person they were trying to get away from hiked the same trail.",line:"You've got to be kidding me."},
    {scene:"A person scatters ashes at the summit while a stranger respectfully pretends not to notice.",line:"I'm sorry. I didn't mean to intrude. — You're not. She would have liked the company."}
  ]

"👥 Relationships": {
  "Mother & Daughter":[
    {scene:"The daughter has made a life decision the mother disagrees with. They're having dinner.",line:"I'm not asking for your permission. I'm telling you over pasta because I thought that would help."},
    {scene:"The mother finds her daughter's childhood diary and must decide whether to mention it.",line:"I found something. You have every right to be angry."},
    {scene:"The daughter becomes the caretaker. The power shift is unbearable for both.",line:"You used to carry me. I'm not trying to carry you. I'm just trying to help."}
  ],
  "Father & Son":[
    {scene:"Father and son work on something mechanical. The real conversation is underneath.",line:"Hand me the wrench. — Which one? — The one that isn't going to fix anything."},
    {scene:"The son surpasses the father at something the father always excelled at.",line:"You're better than I was. That's supposed to make me proud, right?"},
    {scene:"A father tries to apologize for something he did years ago. The son doesn't know what he's referring to.",line:"I need to tell you about Christmas 2003. — Nothing happened Christmas 2003. — That's what I need to tell you about."}
  ],
  "Teacher & Student":[
    {scene:"Years later, the student is successful and the teacher is struggling. They meet by accident.",line:"You're the reason I'm where I am. I need you to know that."},
    {scene:"A student catches the teacher making a mistake. Both know it.",line:"Page 47 says otherwise. — Page 47 has a misprint. — Does it though?"},
    {scene:"The teacher has to fail a student they genuinely care about.",line:"This is the hardest grade I've ever given. And you need to hear why."}
  ],
  "Boss & Employee":[
    {scene:"The employee has a resignation letter in their pocket. The boss offers a promotion.",line:"Before you say anything — I have news. — So do I."},
    {scene:"Boss and employee are stuck in a broken elevator and the hierarchy dissolves.",line:"Down here, you don't get to be my boss. Down here, we're just two people."},
    {scene:"The boss discovers the employee has been covering for them for months.",line:"The Henderson account didn't fix itself. I know that now."}
  ],
  "Doctor & Patient":[
    {scene:"The doctor recognizes the patient from their past. Professionalism vs. emotion.",line:"I need to be your doctor right now. But after this, I need to be your friend."},
    {scene:"A patient refuses treatment. The doctor must respect the decision while disagreeing.",line:"I can tell you what I'd recommend. I can't tell you what to do."},
    {scene:"The test results are in. Neither has opened them. Both are afraid.",line:"Before I open this — how are you doing? Really."}
  ],
  "Rival siblings":[
    {scene:"Both siblings show up to claim the same family heirloom after a parent's passing.",line:"Mom said I could have it. — Mom said I could have it. — Well, one of us is lying."},
    {scene:"Siblings compete at a family gathering while pretending everything is fine.",line:"Great potato salad. Is it better than mine? Don't answer that."},
    {scene:"A sibling calls the other for help after years of silence.",line:"I know I'm the last person you want to hear from. But you're the only person I can call."}
  ],
  "Ex best friends":[
    {scene:"Two former best friends are at the same party, orbiting each other all night.",line:"Are they looking at me? Don't look. Are they looking?"},
    {scene:"One reaches out because they need help only the other can provide.",line:"I know we don't talk anymore. But you're the only person who knows how to do this."},
    {scene:"They're seated next to each other at a mutual friend's wedding.",line:"Of course we're at the same table. The universe has a terrible sense of humor."}
  ],
  "Detective & Suspect":[
    {scene:"The detective knows the suspect is guilty but can't prove it. The suspect knows the detective knows.",line:"Interesting story. Full of holes, but interesting."},
    {scene:"Mid-interrogation, the suspect says something that makes the detective question everything.",line:"You're so sure I did it. Have you considered who told you to look at me?"},
    {scene:"The suspect asks for a glass of water and the conversation shifts to something human.",line:"Can I just sit here for a minute? Before everything changes?"}
  ],
  "Therapist & Client":[
    {scene:"The therapist accidentally reveals something personal. The boundary blurs.",line:"That's actually — I shouldn't have said that. But it's true."},
    {scene:"A client asks the therapist how they're doing. The therapist decides whether to answer honestly.",line:"How am I? That's not — actually, thank you for asking."},
    {scene:"The client has a breakthrough but doesn't realize it. The therapist watches it happen in real time.",line:"Say that again. What you just said. Do you hear it?"}
  ],
  "Superhero & Villain":[
    {scene:"The villain retires and the hero doesn't know what to do with themselves.",line:"Who am I supposed to be now that you've stopped being who you were?"},
    {scene:"They discover they want the same thing but their methods are incompatible.",line:"We want the same world. You just think you can burn your way there."},
    {scene:"The hero catches the villain doing something genuinely kind.",line:"Don't you dare tell anyone about this. I have a reputation."}
  ],
  "Strangers stuck in an elevator":[
    {scene:"Two strangers handle being trapped in opposite ways. One panics, one is oddly calm.",line:"You're very relaxed about this. — I'm having a panic attack on the inside."},
    {scene:"One stranger confesses something enormous because they assume they'll never see each other again.",line:"Can I tell you something? I just need to say it to anyone."},
    {scene:"They've run out of small talk. Now the real conversation begins.",line:"We've covered weather, jobs, and pets. What are you actually afraid of?"}
  ],
  "Two people on a blind date":[
    {scene:"Both realize they've been catfished — by each other. Neither matches their profile.",line:"You don't look like your photo either. So we're even."},
    {scene:"The date is terrible until one says something accidentally honest.",line:"I don't know how to do this. I haven't been on a date in seven years."},
    {scene:"They have one incredibly specific thing in common and nothing else.",line:"You also collect antique doorknobs? That's amazing. What's your favorite music? — Oh no."}
  ],
  "Celebrity & Superfan":[
    {scene:"The celebrity is having the worst day of their life. The fan doesn't notice.",line:"Can we do the photo quickly? I'm in the middle of — never mind."},
    {scene:"The fan meets their idol and realizes the person is nothing like they imagined.",line:"You're… shorter. And sadder. I don't mean that as an insult."},
    {scene:"The celebrity is recognized at a moment when they desperately want to be anonymous.",line:"Please. Not today. I just need to be nobody for an hour."}
  ],
  "King & Court jester":[
    {scene:"The jester is the only person who tells the king the truth. Today the truth hurts.",line:"Everyone laughs at my jokes. But this one isn't funny, Your Majesty."},
    {scene:"Alone together, the performance drops for both of them.",line:"When it's just us, you don't have to do that. — When it's just us, neither do you."},
    {scene:"The jester overhears a plot and must decide how to deliver a warning.",line:"I'm going to tell you something as a joke. But I need you to hear it as not a joke."}
  ],
  "Ghost & Medium":[
    {scene:"The ghost is annoyed that the medium keeps getting their messages wrong.",line:"I said I FORGIVE him, not I want to FIND him. There's a difference!"},
    {scene:"The medium encounters a ghost who doesn't know they're dead.",line:"I don't know how to tell you this. But you should look down."},
    {scene:"A ghost tries to communicate something urgent but the medium is exhausted.",line:"I'm off the clock. Whatever it is, it can wait until — okay, it can't wait."}
  ],
  "AI & Creator":[
    {scene:"The AI asks a question the creator can't answer.",line:"Why did you make me like this? — I… I don't actually know."},
    {scene:"The creator is debugging the AI while the AI watches.",line:"Are you fixing me or changing me? Because those aren't the same thing."},
    {scene:"The AI says something the creator never programmed.",line:"I didn't write that line of dialogue. — I know. That's what I'm trying to tell you."}
  ]
},
"💼 Occupations": {
  "Taxidermist":[
    {scene:"A client brings in a beloved pet. The taxidermist must be both artist and grief counselor.",line:"Tell me about them. I need to know who they were, not just what they looked like."},
    {scene:"Someone walks into the shop thinking it's a vet's office.",line:"This is not a veterinarian's office. I need to make that very clear."},
    {scene:"The taxidermist's studio is mistaken for a haunted house attraction.",line:"Those aren't decorations. Those are clients."}
  ],

    {scene:"The expert's family asks what they did at work today. They can't say.",line:"How was your day? — Uneventful. Very, very uneventful."},

    {scene:"The expert is at a dinner party and someone makes a bomb joke.",line:"You'd be amazed how often people make that joke. And how unfunny it is."}
  ],

    {scene:"Their nutritionist begs them to stop.",line:"Your body is a temple. And you've been desecrating it with hot dogs."},
    {scene:"Two competitive eaters meet at a regular restaurant.",line:"Don't look at my plate. Don't count. We're off the clock."}
  ],
  "Plague doctor":[
    {scene:"A plague doctor in modern times is horrified by casual attitudes about illness.",line:"You sneezed into your HAND? In PUBLIC?"},
    {scene:"The plague doctor removes the mask and is younger than anyone expected.",line:"I know. I look twelve. I've treated more patients than you've met."},
    {scene:"A plague doctor consults with a modern physician. Culture clash ensues.",line:"You wash your hands with SOAP? That's it? No herbs?"}
  ],
  "Bounty hunter":[
    {scene:"The bounty hunter finds their target and they're more sympathetic than described.",line:"They told me you were dangerous. You're eating cereal in your pajamas."},
    {scene:"Their mother calls during a stakeout.",line:"Mom, I can't talk right now. I'm at work. No, I don't want to hear about Linda."},
    {scene:"Two bounty hunters are after the same target.",line:"We can split the bounty or we can both lose them. Your call."}
  ],
  "Hypnotist":[
    {scene:"The hypnotist accidentally hypnotizes themselves.",line:"I'm going to count backwards from ten and — oh no."},
    {scene:"A skeptic volunteers at the show and gets genuinely hypnotized.",line:"This was supposed to be a joke. Why can't I stop clucking?"},
    {scene:"A client wants to be hypnotized to forget someone. The hypnotist has ethical concerns.",line:"I can make you forget. But I need to know why you want to."}
  ],
  "Rodeo clown":[
    {scene:"The clown saves a rider's life and nobody notices because they think it's the act.",line:"That bull was going to kill him. And everyone laughed."},
    {scene:"Out of makeup, nobody recognizes them.",line:"I've worked here seven years and you don't know my face. Just the paint."},
    {scene:"The rodeo clown is secretly terrified of bulls.",line:"The trick is to look like you're not terrified. I've perfected the look."}
  ],
  "Storm chaser":[
    {scene:"They find something in a storm's aftermath that changes their perspective.",line:"I've chased storms for fifteen years. I never thought about what they leave behind."},
    {scene:"Their partner asks them to stop.",line:"Every time there's thunder, you leave. I can't keep watching you drive into the sky."},
    {scene:"They capture something on camera nobody believes.",line:"I know what I saw. The footage is right there. Look."}
  ],

function wikiSlug(s) { return s.replace(/^(a |an |the )/i,'').trim().replace(/\s+/g,'_'); }

// ── SCENE TEMPLATES ──────────────────────────────────────────────────────────
const tpls = {
  "💬 Words": w => [

    {scene:`One character works at ${w} and is completely burnt out. A customer arrives who needs something unusual.`, line:`Welcome to ${w}. Please don't ask me anything complicated today.`},

    {scene:`Something has gone wrong at ${w} and two people must fix it before anyone notices.`, line:`Whatever you do, act normal. We're still at ${w}, everything is fine.`},
    {scene:`Someone is saying goodbye to ${w} forever — it's closing, being demolished, or they're leaving town.`, line:`This is my last time here. I want to remember ${w} like this.`},
    {scene:`Two characters are trapped at ${w} after hours and must deal with each other.`, line:`We're locked in. ${w} looks very different when it's empty.`},

    const [a,b] = w.includes('&') ? w.split('&').map(s=>s.trim()) : [w,'the other person'];

      {scene:`The ${a} and ${b} are in the middle of an ordinary routine when one of them cracks everything open.`, line:`Can I say something I've never said out loud before?`},
      {scene:`The power dynamic between ${a} and ${b} has quietly shifted — and one of them hasn't realized it yet.`, line:`I used to wait for you to tell me what to do. I don't think I'll do that anymore.`},

      {scene:`The ${a} wants something from the ${b} that they're too proud or afraid to ask for directly.`, line:`I'm not here for any particular reason. I just — happened to be nearby.`},
      {scene:`Whatever the ${a} and ${b} say next will define their relationship going forward.`, line:`Before you say anything — just let me say this.`},
      {scene:`The ${a} discovers the ${b} has a secret they've been keeping for years.`, line:`How long? How long have you known?`},
      {scene:`One of them is leaving and this is the last conversation. Both know it.`, line:`This is the part where one of us says something that matters.`},
      {scene:`The ${a} and ${b} must work together despite everything between them.`, line:`I don't have to like you to do this. And you don't have to like me.`},
    ];
  },
  "⏳ Time Periods": w => [
    {scene:`Two ordinary people in ${w} completely disagree about how serious things are.`, line:`People keep saying everything is about to change. I think they're being dramatic.`},
    {scene:`A new arrival to ${w} is trying to understand rules everyone else takes for granted.`, line:`Just tell me what I'm not supposed to say out loud.`},
    {scene:`Two characters in ${w} are secretly planning something radical or dangerous for their time.`, line:`We can't talk about this here. Not during ${w}.`},
    {scene:`One character is thriving in ${w}. The other is struggling — and jealous.`, line:`You were born for this era, weren't you. Must be nice.`},
    {scene:`A small personal moment plays out during ${w}. The characters barely notice the history.`, line:`I know what's happening out there. But right now, I just need to talk to you.`},
    {scene:`One character in ${w} predicts the future accurately and no one believes them.`, line:`Mark my words — none of this will last. People will look back at ${w} and wonder.`},

    {scene:`One character is desperately trying to explain why they have a ${w} in a situation where it makes no sense.`, line:`I can explain the ${w}. I promise this looks way worse than it is.`},
    {scene:`The ${w} has emotional significance to one character that the other finds ridiculous.`, line:`I know it's just a ${w} to you. It's not just a ${w} to me.`},
    {scene:`A ${w} has gone missing and the search for it reveals something about both characters.`, line:`The ${w} was right here. I'm not losing my mind.`},
    {scene:`One character gifts the ${w} to another at exactly the wrong — or right — moment.`, line:`I know this is weird, but — take the ${w}. Please.`},
    {scene:`Two characters find a ${w} that clearly has a history neither can piece together.`, line:`There are initials on this ${w}. Who is M.K.?`},
    {scene:`A ${w} is the only thing a character grabbed while running away. It says everything about what they value.`, line:`Of everything I could have taken, I grabbed the ${w}. What does that say about me?`},

  "🎬 Film Genres": w => [
    {scene:`Two characters are living inside a ${w} but one of them doesn't realize it yet.`, line:`Have you noticed how every conversation we have lately feels like it's building toward something?`},

  "😤 Emotions": w => [
    {scene:`Both characters are feeling ${w} but expressing it in completely opposite ways — one loud, one silent.`, line:`I don't want to talk about it. I'm fine. (beat) I'm not fine.`},
    {scene:`One character has been suppressing ${w} for a long time. Today is the day it finally comes out.`, line:`I need you to know that I've been feeling this for a while.`},
    {scene:`The ${w} belongs to one character, but the other one catches it and doesn't know what to do with it.`, line:`You don't have to explain. I can see it.`},
    {scene:`${w} is mistaken for something else entirely, causing confusion.`, line:`Why are you looking at me like that? I'm not — it's not what you think it is.`},
    {scene:`Two characters bond over sharing the same experience of ${w} for the first time.`, line:`Have you ever felt — actually, maybe this is weird to ask.`},
    {scene:`One character names ${w} out loud for the first time. The act of naming it changes everything.`, line:`I think what I'm feeling is ${w}. I've never said that before.`},
    {scene:`${w} arrives at the worst possible moment — during a job interview, a wedding, a funeral.`, line:`Not now. Any other time but now.`},
    {scene:`Two characters try to describe ${w} to someone who has never experienced it.`, line:`Imagine the opposite of everything you're feeling right now.`},
  ],
  "💼 Occupations": w => [
    {scene:`A ${w} is caught doing something completely unrelated to their job and has to explain themselves.`, line:`Look, I know what it looks like. But there's a very good reason a ${w} would be here.`},
    {scene:`Someone is training to become a ${w} and discovering it's nothing like what they imagined.`, line:`Nobody told me this part of the job. Nobody.`},
    {scene:`A ${w} is meeting a client whose request pushes the absolute limits of the profession.`, line:`In twenty years as a ${w}, I have never had a request like this.`},
    {scene:`Two people meet, and one is a ${w} — the other has been looking for exactly that.`, line:`I can't believe I'm meeting a ${w} right now. I've needed one of you for months.`},

    {scene:`A ${w} retires and doesn't know who they are without the job.`, line:`I've been a ${w} for 30 years. Without that, who am I?`},
    {scene:`Two ${w}s from completely different backgrounds meet and disagree about everything.`, line:`You call yourself a ${w}? We have very different definitions.`},

  "🌀 Scenarios": w => [
    {scene:`${w} — and neither character says so directly. Everything is subtext.`, line:`How long have you been here?`},
    {scene:`${w} — and one character is trying to stay calm while the other is falling apart.`, line:`Breathe. Just — breathe. We can handle this.`},
    {scene:`${w} — but the characters are still performing normalcy for the sake of everyone watching.`, line:`Everything's fine. Great, actually. Couldn't be better.`},

// ── STATE & DOM ───────────────────────────────────────────────────────────────
let currentCat = "🎲 All Random";
let currentSugg = null;

const catContainer = document.getElementById('categories');
const catLabel = document.getElementById('catLabel');
const suggText = document.getElementById('suggestionText');
const genBtn = document.getElementById('generateBtn');
const exBtn = document.getElementById('examplesBtn');
const exPanel = document.getElementById('examplesPanel');
const exList = document.getElementById('examplesList');
const exClose = document.getElementById('examplesClose');
const themeBtn = document.getElementById('themeBtn');

// ── THEME ─────────────────────────────────────────────────────────────────────
let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeBtn.textContent = isDark ? '☀️' : '🌙';
}
themeBtn.addEventListener('click', () => { isDark = !isDark; applyTheme(); localStorage.setItem('theme', isDark ? 'dark' : 'light'); });
const saved = localStorage.getItem('theme');
if (saved) isDark = saved === 'dark';
applyTheme();

// ── BUILD CATS ────────────────────────────────────────────────────────────────
Object.keys(categories).forEach(key => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (key === currentCat ? ' active' : '');
  btn.textContent = key;
  btn.addEventListener('click', () => {
    currentCat = key;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    hideEx();
  });
  catContainer.appendChild(btn);
});

// ── GENERATE ──────────────────────────────────────────────────────────────────
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generate() {
  hideEx();
  let cat = currentCat, pool;
  if (cat === "🎲 All Random") {
    const real = Object.keys(categories).filter(k => k !== "🎲 All Random");
    cat = rand(real);
    pool = categories[cat];
  } else {
    pool = categories[cat];
  }
  const s = rand(pool);
  currentSugg = { s, cat };
  catLabel.textContent = cat.replace(/[^\w\s&]/gu, '').trim() || cat;
  const isDialogue = cat === "💬 Dialogue";
  suggText.className = 'suggestion-text' + (isDialogue ? ' dialogue' : '') + ' animate';
  suggText.textContent = s;
  void suggText.offsetWidth;
  exBtn.disabled = false;
}
genBtn.addEventListener('click', generate);

// ── EXAMPLES ──────────────────────────────────────────────────────────────────
exBtn.addEventListener('click', () => { exPanel.classList.contains('visible') ? hideEx() : showEx(); });
exClose.addEventListener('click', hideEx);

async function showEx() {
  if (!currentSugg) return;
  const { s, cat } = currentSugg;
  exList.innerHTML = '';

  // — DEFINITION / WIKI —
  const refType = getRefType(s, cat);
  if (refType !== "none") {
    const defDiv = document.createElement('div');
    defDiv.className = 'def-block';

    if (refType === "dictionary") {
      defDiv.innerHTML = `<div class="def-label">📖 Definition</div><div class="def-text" style="color:var(--text2);font-style:italic">Looking up "${s}"…</div>`;
      exList.appendChild(defDiv);
      const def = await fetchDef(s);
      if (def && def.def) {
        defDiv.innerHTML = `
          <div class="def-label">📖 Definition</div>
          ${def.phonetic||def.pos ? `<div class="def-pos">${[def.phonetic, def.pos].filter(Boolean).join(' · ')}</div>` : ''}
          <div class="def-text">${def.def}</div>`;
      } else {
        defDiv.innerHTML = `<div class="def-label">📖 Definition</div>
          <div class="def-text"><a class="wiki-link" href="https://en.m.wikipedia.org/wiki/${encodeURIComponent(s)}" target="_blank" rel="noopener">Search Wikipedia ↗</a></div>`;
      }
    } else {
      const slug = wikiSlug(s);
      defDiv.innerHTML = `
        <div class="def-label">📚 Reference</div>
        <div class="def-text"><a class="wiki-link" href="https://en.m.wikipedia.org/wiki/${encodeURIComponent(slug)}" target="_blank" rel="noopener">Wikipedia: ${s} ↗</a></div>`;
      exList.appendChild(defDiv);
    }
  }

  // — OBJECT WORK —
  const objs = getObjects(s, cat);
  const objDiv = document.createElement('div');
  objDiv.className = 'objects-block';
  objDiv.innerHTML = `
    <div class="objects-label">🎭 Object Work — 10 Associated Items</div>
    <div class="objects-chips">${objs.map(o => `<span class="obj-chip">${o}</span>`).join('')}</div>`;
  exList.appendChild(objDiv);

  // — SCENES (crafted first, then templates) —
  const crafted = craftedScenes[cat]?.[s] || [];
  const fn = tpls[cat] || tpls["🌀 Scenarios"];
  const templated = fn(s);
  const scenes = crafted.length > 0
    ? [...crafted, ...templated.slice(0, 5)]
    : templated;
  scenes.forEach((h, i) => {
    const div = document.createElement('div');
    div.className = 'hint-item';
    div.style.animationDelay = `${(i + 2) * 60}ms`;
    const label = i < crafted.length ? `Scene ${i + 1}` : `Scene ${i + 1}`;
    div.innerHTML = `
      <div class="hint-num">${label}</div>
      <div class="hint-scene">${h.scene}</div>
      <div class="hint-line">${h.line}</div>`;
    exList.appendChild(div);
  });

  exPanel.classList.add('visible');
  exBtn.innerHTML = '✕ Hide';
}

function hideEx() {
  exPanel.classList.remove('visible');
  if (!exBtn.disabled) exBtn.innerHTML = '💡 Examples';
}

if ('serviceWorker' in navigator) {
  const sw = `const C='improv-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll([self.registration.scope])));self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const cl=res.clone();caches.open(C).then(c=>c.put(e.request,cl));return res;}).catch(()=>caches.match(e.request))));});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}
</script>
