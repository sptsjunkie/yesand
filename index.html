  <meta name="apple-mobile-web-app-title" content="Improv">

  <title>Improv Prompter</title>

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
    body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px;flex-shrink:0}
    .logo{font-family:'DM Serif Display',Georgia,serif;font-size:22px;letter-spacing:-.3px;color:var(--text)}
    .logo span{color:var(--accent);font-style:italic}
    .theme-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;box-shadow:0 1px 3px var(--shadow)}
    .theme-btn:active{transform:scale(.92)}
    .categories-wrap{padding:0 16px 12px;flex-shrink:0}
    .categories{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;-ms-overflow-style:none}
    .categories::-webkit-scrollbar{display:none}
    .cat-btn{flex-shrink:0;padding:8px 16px;border-radius:100px;border:1px solid var(--border);background:var(--cat-bg);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap}
    .cat-btn:active{transform:scale(.94)}
    .cat-btn.active{background:var(--cat-active);color:var(--cat-active-text);border-color:var(--cat-active)}
    .main{flex:1;display:flex;flex-direction:column;padding:0 24px;gap:16px;min-height:0}
    .suggestion-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 8px var(--shadow)}
    .suggestion-category-label{font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);margin-bottom:4px}
    .suggestion-text{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(28px,8vw,42px);line-height:1.15;color:var(--text)}
    .suggestion-text.dialogue{font-size:clamp(20px,5.5vw,28px);font-style:italic}
    .suggestion-text.empty{font-size:18px;font-family:'DM Sans',sans-serif;font-weight:300;color:var(--text2);font-style:italic}
    .suggestion-text.animate{animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
    @keyframes pop{0%{transform:scale(.88);opacity:.4}100%{transform:scale(1);opacity:1}}
    .actions{display:flex;gap:10px;flex-shrink:0}
    .generate-btn{flex:1;padding:18px;border-radius:14px;background:var(--accent);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;cursor:pointer;transition:all .18s;letter-spacing:-.2px}
    .generate-btn:active{transform:scale(.96);filter:brightness(.9)}
    .examples-btn{padding:18px 20px;border-radius:14px;background:var(--surface);color:var(--text);border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px;white-space:nowrap}
    .examples-btn:active{transform:scale(.96)}
    .examples-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .examples-panel{background:var(--hint-bg);border:1px solid var(--border);border-radius:20px;overflow:hidden;flex-shrink:0;display:none}
    .examples-panel.visible{display:block}
    .examples-header{padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
    .examples-title{font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2)}
    .examples-close{width:28px;height:28px;border-radius:50%;background:var(--border);border:none;cursor:pointer;font-size:14px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .15s}
    .examples-close:active{transform:scale(.9)}
    .examples-scroll{max-height:55vh;overflow-y:auto;padding:0;-webkit-overflow-scrolling:touch}
    .def-block{padding:14px 20px;border-bottom:1px solid var(--border);animation:slideIn .2s ease forwards}
    .def-label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
    .def-pos{font-size:11px;font-style:italic;color:var(--text2);margin-bottom:3px}
    .def-text{font-size:13.5px;line-height:1.5;color:var(--text)}
    .wiki-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--blue);text-decoration:none;font-weight:500}
    .wiki-link:hover{text-decoration:underline}
    .objects-block{padding:14px 20px;border-bottom:1px solid var(--border);opacity:0;animation:slideIn .2s ease .05s forwards}
    .objects-label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:8px}
    .objects-chips{display:flex;flex-wrap:wrap;gap:6px}
    .obj-chip{padding:4px 10px;border-radius:100px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text2)}
    .hint-item{padding:14px 20px;border-bottom:1px solid var(--border);opacity:0;animation:slideIn .2s ease forwards}
    .hint-item:last-child{border-bottom:none}
    @keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .hint-num{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
    .hint-scene{font-size:14px;line-height:1.5;color:var(--text);margin-bottom:6px}
    .hint-line{font-size:13px;font-style:italic;color:var(--text2);line-height:1.4}
    .hint-line::before{content:'"'}
    .hint-line::after{content:'"'}
    footer{padding:12px 24px 20px;text-align:center;flex-shrink:0}
    .footer-text{font-size:11px;color:var(--text2);letter-spacing:.3px}
  </style>
</head>

function getObjects(suggestion, cat) {
  if (objMap[suggestion]) return objMap[suggestion];
  for (const k of Object.keys(objMap)) {
    if (suggestion.toLowerCase().includes(k.toLowerCase()) || k.toLowerCase().includes(suggestion.toLowerCase())) {
      if (objMap[k]) return objMap[k];
    }
  }
  return fallbackObjs[cat] || fallbackObjs["🌀 Scenarios"];
}

// ── DEFINITION / WIKI ────────────────────────────────────────────────────────
function getRefType(suggestion, cat) {
  const isSingle = !suggestion.includes(' ') && !suggestion.includes('&');
  if (cat === "💬 Words" && isSingle) return "dictionary";
  if (["📍 Places","⏳ Time Periods","🎬 Film Genres","💼 Occupations","😤 Emotions"].includes(cat)) return "wikipedia";
  if (isSingle && cat !== "💬 Dialogue") return "wikipedia";
  return "none";
}

async function fetchDef(word) {
  try {
    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`);
    if (!r.ok) return null;
    const d = await r.json();
    const m = d[0]?.meanings?.[0];
    if (!m) return null;
    return { pos: m.partOfSpeech, def: m.definitions?.[0]?.definition, phonetic: d[0]?.phonetic || d[0]?.phonetics?.[0]?.text };
  } catch { return null; }
}

function wikiSlug(s) { return s.replace(/^(a |an |the )/i,'').trim().replace(/\s+/g,'_'); }

  "🧳 Objects": w => [
    {scene:`The ${w} belongs to someone who isn't present. Two characters argue about what to do with it.`, line:`Don't touch the ${w}. We don't know whose it is.`},
    {scene:`One character is desperately trying to explain why they have a ${w} in a situation where it makes no sense.`, line:`I can explain the ${w}. I promise this looks way worse than it is.`},
    {scene:`The ${w} has emotional significance to one character that the other finds ridiculous.`, line:`I know it's just a ${w} to you. It's not just a ${w} to me.`},
    {scene:`A ${w} has gone missing and the search for it reveals something about both characters.`, line:`The ${w} was right here. I'm not losing my mind.`},
    {scene:`One character gifts the ${w} to another at exactly the wrong — or right — moment.`, line:`I know this is weird, but — take the ${w}. Please.`},
  ],
  "🎬 Film Genres": w => [

    {scene:`One character is performing the expected conventions of ${w}. The other keeps breaking them.`, line:`In a ${w}, I'd be the one with all the answers. But I actually don't know.`},
    {scene:`The characters are producing or watching a ${w} and disagree violently about what makes it good.`, line:`You don't understand what ${w} is really supposed to do to an audience.`},
    {scene:`Life suddenly starts following the rules of ${w} and both characters must adapt in real time.`, line:`Okay. Okay. If this is a ${w}, what do we do next?`},
  ],
  "💬 Dialogue": w => [
    {scene:`The line "${w}" is said completely out of context — and the other character has to respond as if it makes perfect sense.`, line:`${w}`},

    {scene:`"${w}" is said as a kind of code. The other character knows exactly what it really means.`, line:`${w}. You know what I mean.`},

    {scene:`One character has been practicing saying "${w}" for a while. This is the first time they've said it out loud.`, line:`Okay. Here goes. ${w}.`},

// ── STATE & DOM ───────────────────────────────────────────────────────────────
let currentCat = "🎲 All Random";
let currentSugg = null;

const catContainer = document.getElementById('categories');
const catLabel = document.getElementById('catLabel');
const suggText = document.getElementById('suggestionText');
const genBtn = document.getElementById('generateBtn');
const exBtn = document.getElementById('examplesBtn');
const exPanel = document.getElementById('examplesPanel');
const exList = document.getElementById('examplesList');
const exClose = document.getElementById('examplesClose');
const themeBtn = document.getElementById('themeBtn');

// ── THEME ─────────────────────────────────────────────────────────────────────
let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeBtn.textContent = isDark ? '☀️' : '🌙';
}
themeBtn.addEventListener('click', () => { isDark = !isDark; applyTheme(); localStorage.setItem('theme', isDark ? 'dark' : 'light'); });
const saved = localStorage.getItem('theme');
if (saved) isDark = saved === 'dark';
applyTheme();

// ── BUILD CATS ────────────────────────────────────────────────────────────────
Object.keys(categories).forEach(key => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (key === currentCat ? ' active' : '');
  btn.textContent = key;
  btn.addEventListener('click', () => {
    currentCat = key;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    hideEx();
  });
  catContainer.appendChild(btn);
});

// ── GENERATE ──────────────────────────────────────────────────────────────────
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generate() {
  hideEx();
  let cat = currentCat, pool;
  if (cat === "🎲 All Random") {
    const real = Object.keys(categories).filter(k => k !== "🎲 All Random");
    cat = rand(real);
    pool = categories[cat];
  } else {
    pool = categories[cat];
  }
  const s = rand(pool);
  currentSugg = { s, cat };
  catLabel.textContent = cat.replace(/[^\w\s&]/gu, '').trim() || cat;
  const isDialogue = cat === "💬 Dialogue";
  suggText.className = 'suggestion-text' + (isDialogue ? ' dialogue' : '') + ' animate';
  suggText.textContent = s;
  void suggText.offsetWidth;
  exBtn.disabled = false;
}
genBtn.addEventListener('click', generate);

// ── EXAMPLES ──────────────────────────────────────────────────────────────────
exBtn.addEventListener('click', () => { exPanel.classList.contains('visible') ? hideEx() : showEx(); });
exClose.addEventListener('click', hideEx);

async function showEx() {
  if (!currentSugg) return;
  const { s, cat } = currentSugg;
  exList.innerHTML = '';

  // — DEFINITION / WIKI —
  const refType = getRefType(s, cat);
  if (refType !== "none") {
    const defDiv = document.createElement('div');
    defDiv.className = 'def-block';

    if (refType === "dictionary") {
      defDiv.innerHTML = `<div class="def-label">📖 Definition</div><div class="def-text" style="color:var(--text2);font-style:italic">Looking up "${s}"…</div>`;
      exList.appendChild(defDiv);
      const def = await fetchDef(s);
      if (def && def.def) {
        defDiv.innerHTML = `
          <div class="def-label">📖 Definition</div>
          ${def.phonetic||def.pos ? `<div class="def-pos">${[def.phonetic, def.pos].filter(Boolean).join(' · ')}</div>` : ''}
          <div class="def-text">${def.def}</div>`;
      } else {
        defDiv.innerHTML = `<div class="def-label">📖 Definition</div>
          <div class="def-text"><a class="wiki-link" href="https://en.m.wikipedia.org/wiki/${encodeURIComponent(s)}" target="_blank" rel="noopener">Search Wikipedia ↗</a></div>`;
      }
    } else {
      const slug = wikiSlug(s);
      defDiv.innerHTML = `
        <div class="def-label">📚 Reference</div>
        <div class="def-text"><a class="wiki-link" href="https://en.m.wikipedia.org/wiki/${encodeURIComponent(slug)}" target="_blank" rel="noopener">Wikipedia: ${s} ↗</a></div>`;
      exList.appendChild(defDiv);
    }
  }

  // — OBJECT WORK —
  const objs = getObjects(s, cat);
  const objDiv = document.createElement('div');
  objDiv.className = 'objects-block';
  objDiv.innerHTML = `
    <div class="objects-label">🎭 Object Work — 10 Associated Items</div>
    <div class="objects-chips">${objs.map(o => `<span class="obj-chip">${o}</span>`).join('')}</div>`;
  exList.appendChild(objDiv);

  // — SCENES —
  const fn = tpls[cat] || tpls["🌀 Scenarios"];
  fn(s).forEach((h, i) => {
    const div = document.createElement('div');
    div.className = 'hint-item';
    div.style.animationDelay = `${(i + 2) * 60}ms`;
    div.innerHTML = `
      <div class="hint-num">Scene ${i + 1}</div>
      <div class="hint-scene">${h.scene}</div>
      <div class="hint-line">${h.line}</div>`;
    exList.appendChild(div);
  });

  exPanel.classList.add('visible');
  exBtn.innerHTML = '✕ Hide';
}

function hideEx() {
  exPanel.classList.remove('visible');
  if (!exBtn.disabled) exBtn.innerHTML = '💡 Examples';
}

// ── SERVICE WORKER ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const sw = `const C='improv-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll([self.registration.scope])));self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const cl=res.clone();caches.open(C).then(c=>c.put(e.request,cl));return res;}).catch(()=>caches.match(e.request))));});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}
</script>
